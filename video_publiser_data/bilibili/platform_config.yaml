material_structure:
  fields:
    title:
      label: 标题
      kind: text
      required: true
      max_length: 80
      hint: 通过 probe_page.py 探测发布页后填写
    description:
      label: 简介
      kind: textarea
      required: false
      max_length: 1000
      hint: ''
    tags:
      label: 标签
      kind: tags
      required: true
      max_count: 3
      candidates: []
    partition:
      label: 分区
      kind: select
      required: true
      candidates: []
    cover:
      label: 封面
      kind: image
      required: true
      hint: 由 generate_material.py 通过 comfyui-scheduler 文生图生成
    video:
      label: 视频文件
      kind: video
      required: true
      hint: 待发布的本地视频文件
default_config:
  title_format: '{video_name}'
  description_format: ''
  tags: []
  partition: ''
  auto_cover: true
  publish_script_hint: ''
publish_script: ''
