# project_config.yaml 示例（tech 科技类项目，向 B站 发布）。
# 实际文件由 init_project.py 生成骨架，agent 按发布请求填写以下字段。
# 项目概念 = 视频分类：tech。
project:
  name: tech
  project_root_path: "{workspace}/video_publiser_data/bilibili/projects/tech"
  creation_mode: auto # auto（默认）| manual；手动模式下关键步骤暂停等待用户审核
  description: "科技类视频（硬件评测、技术科普）"
  platforms: [bilibili, douyin] # 本项目可发往的平台列表
# 发布默认值：优先级高于平台级 default_config
publish_defaults:
  title_format: "{video_name} | 科技前沿"
  description_format: "本期视频：{video_name}。欢迎点赞收藏，关注解锁更多科技内容。"
  tags: [科技, 硬核科普]
  partition: 科技
  auto_cover: true
# 物料生成配置
material:
  video_source_dir: "D:/videos/tech" # 待发布视频所在目录（示例）
cover:
  # 封面文生图（comfyui-scheduler），B站封面规格 3:2 1600x1000
  # 注意：workflow 名须为本机 comfyui-scheduler 已导入的实际工作流
  # （示例本机为 z_image_fp16；其他机器以 comfyui-scheduler 查询结果为准）
  comfyui_workflow: z_image_fp16
  # {title} {video_name} {date} {project} 恒可用；{topic} {summary}
  # 在提供 --video-config（explainer-video-maker 联动）时可用
  prompt: "科技感封面图，主题：{topic}，深蓝背景配电路纹理，金属质感标题区，专业高清"
  width: 1600
  height: 1000
  seed: 0
  negative_prompt: "文字水印，模糊，低质量"
# 依赖路径
dependence_paths:
  comfyui_scheduler: "D:/dev/comfyui-scheduler" # 示例；仅提示安装位置
  comfyui_url: "http://127.0.0.1:8188"
