# platform_config.yaml 示例（B站，首次发布流程探测后完善完成的形态）。
# 实际文件由 init_platform.py 生成骨架，agent 依据 probe_page.py 的 DOM 探测
# 结果填写/完善以下字段。此示例展示填写后的完整形态，路径中的 {workspace}
# 为实际工作区绝对路径占位。
platform:
  name: bilibili
  aliases: [B站, 哔哩哔哩, bilibili, b站]
  data_dir: "{workspace}/video_publiser_data/bilibili"
  publish_page_url: "https://member.bilibili.com/platform/upload/video/frame"
  # 登录检测：URL 包含 passport.bilibili.com 时为未登录；已登录后发布页
  # URL 包含 /platform/upload，且页面出现"投稿管理"入口（登录指示二选一命中即可）
  login_indicator:
    url_contains: "/platform/upload/video/frame"
    selector: "input[placeholder*='标题']"
  # 登录态管理（playwright storageState）：首次 VNC 登录成功后自动保存到
  # {data_dir}/storage_state.json，后续发布优先复用；过期或缺失时再次走
  # VNC 人机协作登录并重新保存。
  login:
    storage_state_path: "" # 留空 = 默认 {workspace}/video_publiser_data/bilibili/storage_state.json
  # 环境端口对齐 hermes-hitl-environment：人类 VNC(5900)/noVNC(6080)，
  # agent 经 CDP(9222) 驱动同一共享浏览器；解析优先级 环境变量 > 配置 > 默认
  cdp:
    host: 127.0.0.1
    port: 9222 # CHROME_REMOTE_DEBUGGING_PORT / PLAYWRIGHT_CDP_URL 可覆盖
    vnc_port: 5900 # VNC 端口（VNC_PORT 可覆盖）
    novnc_port: 6080 # noVNC 端口，浏览器访问 http://127.0.0.1:6080/vnc.html（NOVNC_PORT 可覆盖）
    browser_path: "" # 空 = playwright chromium；可填系统 Chrome/Edge 路径
    profile_dir: "" # 留空默认 {workspace}/video_publiser_data/browser_profile
    downloads_dir: "" # 留空默认 {workspace}/video_publiser_data/downloads
# 物料数据结构：发布页表单字段的梳理结果（首次流程探测后填写）。
# 与发布脚本 {platform}_publish.py 共享，脚本按此结构读取 materials.yaml。
material_structure:
  fields:
    title:
      label: 标题
      kind: text
      required: true
      max_length: 80
      hint: "发布页标题输入框，placeholder 含'标题'"
    description:
      label: 简介
      kind: textarea
      required: false
      max_length: 1000
      hint: ""
    tags:
      label: 标签
      kind: tags
      required: true
      max_count: 3
      hint: "输入后回车确认；脚本用 TAGS_SELECTOR + Enter 键"
    partition:
      label: 分区
      kind: select
      required: true
      candidates: [科技, 数码, 游戏, 生活, 知识, 娱乐] # 探测到的分区选项
      hint: "B站为二级分区树，脚本按一级分区文本点击"
    cover:
      label: 封面
      kind: image
      required: true
      hint: "封面规格 3:2（1600x1000），由 comfyui-scheduler 生成或手动提供"
    video:
      label: 视频文件
      kind: video
      required: true
      hint: "待发布视频，脚本通过 input[type=file] 上传"
    original_declaration:
      label: 原创声明
      kind: checkbox
      required: false
      hint: "勾选'未经作者授权，禁止转载'"
# 自动模式默认配置模板（手动模式作为表单初值供审核）。
# 取值优先级：项目 publish_defaults > 平台 default_config。
default_config:
  title_format: "{video_name}"
  description_format: "视频简介：{video_name}。更多内容欢迎一键三连！"
  tags: [科技, 科普]
  partition: 科技
  auto_cover: true
  publish_script_hint: "自动模式直接按默认模板生成物料并发布"
# 发布脚本绝对路径（首次流程编写完成后回填）
publish_script: "{workspace}/video_publiser_data/bilibili/publish_scripts/bilibili_publish.py"
