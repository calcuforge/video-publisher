# account_config.yaml 示例：同平台多账号的账号级配置。
# 由 init_account.py 生成并回填（name/account_dir/storage_state_path/cdp.port），
# agent 填写 display_name/aliases（用户口语匹配用，如"发到小号B"）。
# 账号唯一标识 = 目录名（accounts/account_b/）。
account:
  name: account_b
  display_name: "小号B"
  aliases: [小号B, b号, backup]
  account_dir: "{workspace}/video_publiser_data/bilibili/accounts/account_b"
  # 每账号独立登录态（VNC 登录后自动保存到本账号目录）——账号隔离的核心
  login:
    storage_state_path: "{workspace}/video_publiser_data/bilibili/accounts/account_b/storage_state.json"
  # 默认共用模式：port = 平台实例端口（9222），profile_dir 留空——
  # 所有账号连同一浏览器实例，框架为每个账号创建隔离 context（独立 cookie）
  # 如需完全隔离（独立指纹），改独立端口 + 填 profile_dir 并用 launch_browser 启动
  cdp:
    host: 127.0.0.1
    port: 9222
    profile_dir: ""
  notes: "备用号，仅发布科技分类内容"
