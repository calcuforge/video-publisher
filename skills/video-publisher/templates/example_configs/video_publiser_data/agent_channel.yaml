# agent_channel.yaml 示例 — 人机协作通知推送配置（可选）。
# 实际文件位于工作区级：{workspace}/video_publiser_data/agent_channel.yaml，
# 属于该工作区全部平台/项目共用（与 hermes 环境变量等价，见下方 env 简化写法）。
# 不配置本文件 = 不推送，仅依赖脚本的 @ENV@ 提示与 agent 转达。
#
# 配置解析优先级：
#   1. 环境变量 AGENT_CHANNEL_CONFIG → 指向本文件
#   2. 默认位置 {workspace}/video_publiser_data/agent_channel.yaml
#   3. 环境变量 AGENT_CHANNEL → 简化写法：
#      - http(s):// 开头 → webhook URL
#      - 其他 → 命令模板（{message} 占位）
enabled: true
# command：执行命令模板（如 Claude 桌面通知、hermes gateway CLI、任意脚本）；
# webhook：HTTP POST JSON {"text": message}（如钉钉/Slack/Telegram 机器人）
type: command
# command 示例（{message} 会被替换为提示内容）：
target: 'claude notify "{message}"'
# webhook 示例（取消上面注释、改 type: webhook）：
# type: webhook
# target: "https://oapi.dingtalk.com/robot/send?access_token=your-token"
message_template: "⚠ 需要人工配合：{message}"
timeout: 10
